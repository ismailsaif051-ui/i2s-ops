# Déploiement cloud (décision D1). En développement local, PostgreSQL 18 est
# déjà installé sur le poste : ce fichier n'est pas nécessaire pour coder.
#
#   docker compose --env-file .env.production up -d

services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-i2s_ops}
      POSTGRES_USER: ${POSTGRES_USER:-i2s}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?mot de passe requis}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER:-i2s}']
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ['redis-server', '--appendonly', 'yes']
    volumes:
      - redis-data:/data

  # Stockage objet pour la GED, les photos d'inspection et les PDF générés.
  minio:
    image: minio/minio:latest
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_USER:?utilisateur requis}
      MINIO_ROOT_PASSWORD: ${MINIO_PASSWORD:?mot de passe requis}
    volumes:
      - minio-data:/data
    ports:
      - '9000:9000'
      - '9001:9001'

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://${POSTGRES_USER:-i2s}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-i2s_ops}?schema=public
      JWT_SECRET: ${JWT_SECRET:?secret requis}
      WEB_ORIGIN: ${WEB_ORIGIN:-http://localhost:3000}
      PORT: 4000
    ports:
      - '4000:4000'

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    restart: unless-stopped
    depends_on:
      - api
    environment:
      NODE_ENV: production
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://api:4000/api/v1}
    ports:
      - '3000:3000'

volumes:
  postgres-data:
  redis-data:
  minio-data:
